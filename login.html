<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nada Yasser | تسجيل الدخول</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:linear-gradient(135deg,#071A35,#0B2F5B);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

/* خلفية متحركة */

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#38BDF8;

border-radius:50%;

top:-180px;

left:-150px;

opacity:.18;

}

body::after{

content:"";

position:absolute;

width:450px;

height:450px;

background:#8468ff;

border-radius:50%;

bottom:-170px;

right:-120px;

opacity:.18;

}

.login-box{

position:relative;

width:730px;

padding:40px;

background:rgba(251, 251, 252, 0.12);

backdrop-filter:blur(20px);

border-radius:25px;

box-shadow:0 20px 45px rgba(252, 251, 251, 0.4);

color:white;

z-index:10;

}

.logo{

text-align:center;

font-size:42px;

font-weight:bold;

color:#D4AF37;

margin-bottom:10px;

}

.platform{

text-align:center;

font-size:24px;

margin-bottom:30px;

}

label{

display:block;

margin-top:15px;

margin-bottom:8px;

font-weight:bold;

}

input,select{

width:100%;

padding:14px;

border:none;

border-radius:12px;

font-size:16px;

outline:none;

}

.password-box{

position:relative;

}

.password-box input{

padding-left:45px;

}

.eye{

position:absolute;

left:15px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

font-size:20px;

}

.options{

display:flex;

justify-content:space-between;

align-items:center;

margin-top:18px;

font-size:14px;

}

.options a{

color:#38BDF8;

text-decoration:none;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:18px;

cursor:pointer;

margin-top:15px;

transition:.3s;

}

.login-btn{

background:#D4AF37;

color:#000000;

font-weight:bold;

}

.login-btn:hover{

transform:scale(1.03);

}

.quick-btn{

background:#38BDF8;

color:rgb(255, 255, 255);

}

.quick-btn:hover{

transform:scale(1.03);

}

.footer{

text-align:center;

margin-top:20px;

font-size:13px;

opacity:.8;

}

.home-btn{

display:inline-block;

background:#071A35;

color:white;

padding:12px 25px;

border-radius:10px;

text-decoration:none;

font-size:18px;

font-weight:bold;

transition:0.3s;

}
body {
    margin: 0;
    padding: 0;
}

.page-header {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 0 20px;
    box-sizing: border-box;
    direction: ltr;
    z-index: 10;
}

.university-logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
}

.faculty-logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
}

</style>

</head>
<body>
    
<header class="page-header">
    <img src="assets/images/download.jpeg"
         alt="شعار جامعة دمياط"
         class="university-logo">

    <img src="assets/images/download (1).jpeg"
         alt="شعار كلية التربية"
         class="faculty-logo">
</header>

    <div class="login-box">
    
    <div class="logo">
    NY
    </div>
    
    <div class="platform">
تعلم مهارات إنتاج الرسومات الرقمية التعليمية والثقافة البصرية     </div>
    
    <label>نوع المستخدم</label>
    
    <select id="role">
    
    <option value="student">طالب</option>
    
    <option value="teacher">معلم</option>
    
    </select>
    
    <label>اسم المستخدم</label>
    
    <input
type="text"
id="username"
placeholder="اسم المستخدم">
    
    <label>كلمة المرور</label>
    
    <div class="password-box">
    
<input
type="password"
id="password"
placeholder="كلمة المرور">

    <span
    class="eye"
    onclick="togglePassword()">
    👁️
    </span>
    
    </div>
    
    <div class="options">
    
    <label>
    
    <input type="checkbox">
    
    تذكرني
    
    </label>
    
    <a href="#">
    
    نسيت كلمة المرور؟
    
    </a>
    
    </div>
    
    <button onclick="login()" style="background-color: #FFD700; color: black; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer;">

تسجيل الدخول

</button>
    
    <div style="margin-top:15px; text-align:center;">

    <a href="index.html" class="home-btn">
        العودة إلى الصفحة الرئيسية
    </a>

</div>
    
    <div class="footer">
    
    © 2026 Nada Yasser 
    
    </div>
    
    </div>
    
    <script>
    // إنشاء جميع المستخدمين

const users = {
    "teacher": "1234"
};

// إضافة 150 طالبًا تلقائيًا

for (let i = 1; i <= 150; i++) {

    const username = "student" + String(i).padStart(2, "0");

    users[username] = "1234";

}

function login() {

    const username = document.getElementById("username").value.trim();

    const password = document.getElementById("password").value.trim();

    if (users[username] && users[username] === password) {

        // حفظ اسم المستخدم

        localStorage.setItem("currentUser", username);

        // حفظ نوع المستخدم

        if (username === "teacher") {

            localStorage.setItem("role", "teacher");

        } else {

            localStorage.setItem("role", "student");

        }

        // الانتقال للصفحة الرئيسية للمقرر

        window.location.href = "home.html";

    } else {

        alert("اسم المستخدم أو كلمة المرور غير صحيحة");

    }

}
    
    </script>
    
    </body>
    
    </html>
